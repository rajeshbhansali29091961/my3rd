
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ---------------------------------------------------------
      # 1. Checkout source
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 3. Java
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 4. Flutter
      # ---------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # 5. Android SDK
      # ---------------------------------------------------------
      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip \
            -d "$HOME/android/cmdline-tools"

          mv \
            "$HOME/android/cmdline-tools/cmdline-tools" \
            "$HOME/android/cmdline-tools/latest"

          echo "ANDROID_HOME=$HOME/android" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android" >> "$GITHUB_ENV"

          echo "$HOME/android/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android/platform-tools" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # 6. Android SDK / NDK
      # ---------------------------------------------------------
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.1.8937393"

      # ---------------------------------------------------------
      # 7. Download Swiss Ephemeris
      # ---------------------------------------------------------
      - name: Get Swiss Ephemeris source
        run: |
          git clone --depth 1 \
            https://github.com/aloistr/swisseph.git \
            sweph-src

          echo "Swiss Ephemeris source:"
          ls -la sweph-src

      # ---------------------------------------------------------
      # 8. Compile Swiss Ephemeris C library
      # ---------------------------------------------------------
      - name: Build libswe.so ARM64
        run: |
          set -eux

          NDK="$HOME/android/ndk/25.1.8937393"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang"

          mkdir -p native/arm64-v8a

          cd sweph-src

          "$CC" \
            -shared \
            -fPIC \
            -O2 \
            -o ../native/arm64-v8a/libswe.so \
            swedate.c \
            swehouse.c \
            swejpl.c \
            swemmoon.c \
            swemplan.c \
            sweph.c \
            swephlib.c \
            swecl.c \
            swehel.c \
            -lm

          cd ..

          echo "Checking libswe.so:"
          file native/arm64-v8a/libswe.so

          readelf -h native/arm64-v8a/libswe.so | grep -E \
            "Class|Machine"

      # ---------------------------------------------------------
      # 9. Verify the library
      # ---------------------------------------------------------
      - name: Verify ARM64 library
        run: |
          set -eux

          test -f native/arm64-v8a/libswe.so

          file native/arm64-v8a/libswe.so

          ls -lh native/arm64-v8a/libswe.so

      # ---------------------------------------------------------
      # 10. Ephemeris files
      # ---------------------------------------------------------
      - name: Prepare ephemeris
        run: |
          set -eux

          mkdir -p native/ephe

          echo "Available ephemeris files:"
          find sweph-src/ephe -maxdepth 1 -type f | sort | head -50

          # Planetary ephemeris
          if [ -f sweph-src/ephe/sepl_18.se1 ]; then
            cp sweph-src/ephe/sepl_18.se1 native/ephe/
          fi

          # Moon ephemeris
          if [ -f sweph-src/ephe/semo_18.se1 ]; then
            cp sweph-src/ephe/semo_18.se1 native/ephe/
          fi

          # Asteroid ephemeris if available
          if [ -f sweph-src/ephe/seas_18.se1 ]; then
            cp sweph-src/ephe/seas_18.se1 native/ephe/
          fi

          echo "Final ephemeris:"
          ls -lh native/ephe/

      # ---------------------------------------------------------
      # 11. Install Flet
      # ---------------------------------------------------------
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.28.3

      # ---------------------------------------------------------
      # 12. Show Flet information
      # ---------------------------------------------------------
      - name: Flet information
        run: |
          flet --version
          python --version
          flutter --version

      # ---------------------------------------------------------
      # 13. Show project
      # ---------------------------------------------------------
      - name: Show project files
        run: |
          echo "Project:"
          find . -maxdepth 2 -type f | sort

          echo "Native libraries:"
          find native -type f -exec file {} \;

      # ---------------------------------------------------------
      # 14. Gradle memory
      # ---------------------------------------------------------
      - name: Configure Gradle
        run: |
          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" << 'EOF'
          org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.daemon=false
          EOF

      # ---------------------------------------------------------
      # 15. Build ARM64 APK
      # ---------------------------------------------------------
      - name: Build APK
        run: |
          set -eux

          export ANDROID_HOME="$HOME/android"
          export ANDROID_SDK_ROOT="$HOME/android"

          flet build apk \
            --arch arm64-v8a \
            --verbose \
            --no-rich-output

      # ---------------------------------------------------------
      # 16. Inspect APK
      # ---------------------------------------------------------
      - name: Inspect APK
        run: |
          set -eux

          find build -type f -name "*.apk" -print

          for apk in $(find build -type f -name "*.apk"); do
            echo "======================================"
            echo "APK: $apk"
            echo "======================================"

            unzip -l "$apk" | grep -E \
              "lib/arm64-v8a|libswe|swisseph" || true
          done

      # ---------------------------------------------------------
      # 17. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bhoovalaya-arm64-apk
          path: build/apk/*.apk
          retention-days: 30
