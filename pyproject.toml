[project]
name = "bhoovalaya"
version = "1.0.0"
description = "Bhoovalaya Oracle — Vedic / Bhoovalaya stock timing app"
requires-python = ">=3.10"
dependencies = [
    "flet==0.28.3",
    "swisseph-ffi",
    "requests",
]

[tool.flet]
org = "com.bhoovalaya"
product = "BhoovalayaOracle"
company = "Bhoovalaya"
# Entry point
main = "main.py"
assets_dir = "assets"

[tool.flet.android]
# FIXED for parsing error on Android 13/14
min_sdk_version = 21
target_sdk_version = 33
compile_sdk_version = 33
permissions = [
    "android.permission.INTERNET",
]
# Build ONLY arm64-v8a to avoid split-APK parsing error (modern phones are 64-bit)
# If you need old 32-bit phones, change to ["arm64-v8a", "armeabi-v7a"]
target_arch = ["arm64-v8a"]

[tool.flet.build]
# Ensure assets are packaged
assets_dir = "assets"

