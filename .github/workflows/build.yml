name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux deps (FIX for your error)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libmpv-dev mpv

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$HOME/android/cmdline-tools"
          mv "$HOME/android/cmdline-tools/cmdline-tools" "$HOME/android/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android" >> "$GITHUB_ENV"
          echo "$HOME/android/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393"

      - name: Get Swiss Ephemeris source
        run: git clone --depth 1 https://github.com/aloistr/swisseph.git sweph-src

      - name: Build libswe.so ARM64
        run: |
          NDK="$HOME/android/ndk/25.1.8937393"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          mkdir -p native/arm64-v8a
          cd sweph-src
          $CC -shared -fPIC -O2 -o ../native/arm64-v8a/libswe.so swedate.c swehouse.c swejpl.c swemmoon.c swemplan.c sweph.c swephlib.c swecl.c swehel.c -lm
          cd ..

      - name: Prepare ephemeris data
        run: |
          mkdir -p native/ephe
          for f in sepl_18.se1 semo_18.se1 seas_18.se1; do
            if [ -f "sweph-src/ephe/$f" ]; then cp "sweph-src/ephe/$f" "native/ephe/$f"; fi
            if [ ! -f "native/ephe/$f" ] && [ -f "ephe-cache/$f" ]; then cp "ephe-cache/$f" "native/ephe/$f"; fi
          done
          ls -lh native/ephe/

      - name: Stage native for Flet
        run: |
          if [ -f src/main.py ]; then
            mkdir -p src/native/arm64-v8a src/native/ephe
            cp -a native/arm64-v8a/libswe.so src/native/arm64-v8a/ || true
            cp -a native/ephe/. src/native/ephe/ || true
          fi

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install "flet==0.28.3"

      - name: Configure Gradle
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" > "$HOME/.gradle/gradle.properties"
          echo "org.gradle.daemon=false" >> "$HOME/.gradle/gradle.properties"

      - name: Build APK
        run: |
          export ANDROID_HOME="$HOME/android"
          flet build apk --arch arm64-v8a --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bhoovalaya-arm64-apk
          path: build/apk/*.apk
