name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true
      - name: Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/android/cmdline-tools
          unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android/cmdline-tools
          mv $HOME/android/cmdline-tools/cmdline-tools $HOME/android/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/platform-tools" >> $GITHUB_PATH
      - name: SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393"

      - name: Clone Swiss Ephemeris C source
        run: |
          git clone https://github.com/aloistr/swisseph.git sweph-src
          echo "Repo contents:"
          ls -la sweph-src

      - name: Cross-compile libswe.so for arm64-v8a (Android)
        run: |
          NDK_DIR="$HOME/android/ndk/25.1.8937393"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang"

          mkdir -p native/arm64-v8a
          cd sweph-src

          $CC -shared -fPIC -O2 -o ../native/arm64-v8a/libswe.so \
            swedate.c swehouse.c swejpl.c swemmoon.c swemplan.c \
            sweph.c swephlib.c swecl.c swehel.c \
            -lm

          echo "Built libswe.so:"
          ls -la ../native/arm64-v8a/

      - name: Copy ephemeris data files
        run: |
          mkdir -p native/ephe
          echo "Contents of sweph-src/ephe:"
          ls sweph-src/ephe | head -30
          cp sweph-src/ephe/sepl_18.se1 native/ephe/ 2>/dev/null || echo "sepl_18.se1 not found, check listing above"
          cp sweph-src/ephe/semo_18.se1 native/ephe/ 2>/dev/null || echo "semo_18.se1 not found, check listing above"
          echo "Ephemeris files copied:"
          ls -la native/ephe/

      - name: Check for oversized assets
        run: |
          echo "PNG/JPG files over 300KB (common cause of asset-compression memory failures):"
          find . -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" | xargs -I{} du -h {} 2>/dev/null | sort -rh | head -20

      - name: Install Flet
        run: pip install flet==0.28.3

      - name: Configure Gradle memory
        run: |
          mkdir -p $HOME/.gradle
          cat >> $HOME/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.daemon=false
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android
          export ANDROID_SDK_ROOT=$HOME/android
          flet build apk --verbose --no-rich-output
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bhoovalaya-apk
          path: build/apk/*.apk
          retention-days: 30
