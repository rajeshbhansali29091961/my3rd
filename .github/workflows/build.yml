name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3
          pip install flet-cli

      - name: Create Flet project structure
        run: |
          mkdir -p temp_build/src
          cp main.py temp_build/src/main.py
          echo -e "name: bhoovalaya_oracle\nflet:\n " > temp_build/pyproject.toml
          cat pyproject.toml >> temp_build/pyproject.toml || echo "dependencies = [\"flet==0.28.3\"]" >> temp_build/pyproject.toml
          cd temp_build
          flutter config --no-analytics
          flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: temp_build/build/apk
