[project]
name = "bhoovalaya"
version = "1.0.0"
description = "Bhoovalaya Oracle — Vedic / Bhoovalaya stock timing app"
requires-python = ">=3.10"
dependencies = [
    "flet==0.28.3",
    "swisseph-ffi",
    "requests",
]

[tool.flet]
org = "com.bhoovalaya"
product = "BhoovalayaOracle"
company = "Bhoovalaya"
# App entry (repo root). Change to "src" if main.py lives under src/
# path = "."

[tool.flet.android]
permissions = [
    "android.permission.INTERNET",
]
# Target modern 64-bit phones only (matches build.yml --arch arm64-v8a)
target_arch = ["arm64-v8a"]
# legacy_packaging / --android-legacy-packaging only exist on Flet 0.86+.
# With flet==0.28.3 leave this unset (not supported).

# Optional: explicit features if you need them later
# [tool.flet.android.feature]
# "android.hardware.touchscreen" = false
